[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatorway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.4",
  "redis>=5",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastmcp>=4.0",
  "google-genai>=2.0",
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23",
  "PyJWT>=2.8",
  "anyio>=4",
  "tqdm>=4",
  "sentence-transformers>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.23", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["gatorway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
